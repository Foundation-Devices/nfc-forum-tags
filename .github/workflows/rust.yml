name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the build needs only to read the repository. Without this,
# the run inherits the repository default, which may be a write-capable token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the workflow credential in .git/config where any
          # later step (including third-party action code) could reuse it.
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --verbose
      - name: Build (alloc)
        run: cargo build --verbose --features alloc
      - name: Build (std)
        run: cargo build --verbose --features std
      - name: Test
        run: cargo test --verbose
      - name: Test (alloc)
        run: cargo test --verbose --features alloc
      - name: Test (std)
        run: cargo test --verbose --features std
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --verbose --all-features -- -D warnings

  audit:
    # Runs with no token at all, so a malicious cargo-audit release cannot
    # reach any repository credential. The version is pinned so a newly
    # published release is never resolved automatically.
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit
        run: cargo audit
